<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6FA8DC">
  <meta name="author" content="jnetzhou">
  <meta name="copyright" content="© 2026 jnetzhou">
  <title>周大航的任务系统</title>
  <link rel="icon" href="favicon.ico?v=20261041" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=20261041">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20261041">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png?v=20261041">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20261041">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png?v=20261041">
  <link rel="stylesheet" href="css/style.css?v=20261083">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="app-title">
      <span class="app-title-ico" id="app-title-ico" title="点击创建快捷方式">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <g stroke="#3B2E2A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
            <!-- 六条腿 -->
            <path d="M7.8 19.6L3.4 17.2M7 22.4H2.4M7.9 25L4.3 27.9" fill="none"/>
            <path d="M24.2 19.6l4.4-2.4M25 22.4h4.6M24.1 25l3.6 2.9" fill="none"/>
            <!-- 左钳：连着小臂一起抬，像托住左边的字 -->
            <g class="crab-claw crab-claw-l">
              <path d="M10.4 16.6C9.2 14.8 8.4 13.8 7.4 12.9" fill="none" stroke-width="2"/>
              <path d="M2.4 12.9C1 10.3 2 7.2 4.6 6.4c1.6-.5 3 .4 3.2 1.7.2 1.5-1 2.4-2.3 2.2 1.3.8 1.7 1.6 1.1 2.6-.8 1.4-3 1.6-4.2 0z" fill="#FF7A4D"/>
            </g>
            <!-- 右钳：伸到标题字下面 -->
            <g class="crab-claw crab-claw-r">
              <path d="M21.6 16.6c1.2-1.8 2-2.8 3-3.7" fill="none" stroke-width="2"/>
              <path d="M29.6 12.9C31 10.3 30 7.2 27.4 6.4c-1.6-.5-3 .4-3.2 1.7-.2 1.5 1 2.4 2.3 2.2-1.3.8-1.7 1.6-1.1 2.6.8 1.4 3 1.6 4.2 0z" fill="#FF7A4D"/>
            </g>
            <!-- 蟹壳 -->
            <path d="M6.6 22.4c.2-4.2 4.4-6.9 9.4-6.9s9.2 2.7 9.4 6.9c.1 2.7-4.2 4.6-9.4 4.6s-9.5-1.9-9.4-4.6z" fill="#FF7A4D"/>
            <!-- 眼睛 -->
            <circle cx="13" cy="17" r="2" fill="#FFFCF2"/>
            <circle cx="19" cy="17" r="2" fill="#FFFCF2"/>
            <circle cx="13.2" cy="17.2" r=".9" fill="#3B2E2A" stroke="none"/>
            <circle cx="19.2" cy="17.2" r=".9" fill="#3B2E2A" stroke="none"/>
          </g>
        </svg>
      </span>
      <span class="app-title-text"><span class="t-char">周</span><span class="t-char">大</span><span class="t-char">航</span><span class="t-char">的</span><span class="t-char">任</span><span class="t-char">务</span><span class="t-char">系</span><span class="t-char">统</span></span>
      <span class="app-title-ico app-title-ico-r" id="app-title-lobster" title="点击创建快捷方式">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <g stroke="#3B2E2A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
            <!-- 两根触须 -->
            <path d="M12.8 12.4C11 10.1 9.2 9.1 7 9.4" fill="none" stroke-width="1.3"/>
            <path d="M19.2 12.4c1.8-2.3 3.6-3.3 5.8-3" fill="none" stroke-width="1.3"/>
            <!-- 左钳 -->
            <g class="lob-claw lob-claw-l">
              <path d="M11 16.6c-1.2-1.8-2-2.8-3-3.7" fill="none" stroke-width="2"/>
              <path d="M2.4 12.9C1 10.3 2 7.2 4.6 6.4c1.6-.5 3 .4 3.2 1.7.2 1.5-1 2.4-2.3 2.2 1.3.8 1.7 1.6 1.1 2.6-.8 1.4-3 1.6-4.2 0z" fill="#FF7A4D"/>
            </g>
            <!-- 右钳 -->
            <g class="lob-claw lob-claw-r">
              <path d="M21 16.6c1.2-1.8 2-2.8 3-3.7" fill="none" stroke-width="2"/>
              <path d="M29.6 12.9C31 10.3 30 7.2 27.4 6.4c-1.6-.5-3 .4-3.2 1.7-.2 1.5 1 2.4 2.3 2.2-1.3.8-1.7 1.6-1.1 2.6.8 1.4 3 1.6 4.2 0z" fill="#FF7A4D"/>
            </g>
            <!-- 身体（细长的龙虾身） -->
            <ellipse cx="16" cy="19" rx="6.2" ry="7.8" fill="#FF7A4D"/>
            <!-- 腹节花纹 -->
            <path d="M10.6 20.4h10.8M11.4 23.6h9.2" fill="none" stroke-width="1.2"/>
            <!-- 尾巴（三片扇尾） -->
            <path d="M16 26.8v3" fill="none" stroke-width="1.8"/>
            <path d="M13.2 27 11 30.4M18.8 27 21 30.4" fill="none" stroke-width="1.8"/>
            <!-- 眼睛 -->
            <circle cx="13.6" cy="14" r="1.9" fill="#FFFCF2"/>
            <circle cx="18.4" cy="14" r="1.9" fill="#FFFCF2"/>
            <circle cx="13.8" cy="14.2" r=".85" fill="#3B2E2A" stroke="none"/>
            <circle cx="18.6" cy="14.2" r=".85" fill="#3B2E2A" stroke="none"/>
          </g>
        </svg>
      </span>
    </div>
    <div class="header-tools">
      <button class="icon-btn" id="btn-add-child" title="新增小朋友">➕</button>
      <button class="icon-btn" id="btn-edit-child" title="编辑当前小朋友">✏️</button>
      <button class="icon-btn" id="btn-delete-child" title="删除当前小朋友">🗑️</button>
      <!-- 手机端用不到单独的编辑/删除按钮，收进这个「更多」菜单 -->
      <div class="more-wrap">
        <button class="icon-btn" id="btn-more-child" title="更多操作">⋯</button>
        <div class="more-menu" id="more-menu">
          <button class="more-item" data-act="edit">✏️ 编辑小朋友</button>
          <button class="more-item danger" data-act="delete">🗑️ 删除小朋友</button>
        </div>
      </div>
      <button class="icon-btn lock-btn locked" id="btn-lock" title="已上锁（点击解锁）">🔒</button>
    </div>
    <div class="header-actions">
      <button class="btn-primary btn-sm btn-add-task" id="btn-add-task">＋ 新增任务</button>
      <button class="btn-primary btn-sm" id="btn-add-reward">🎁 奖赏</button>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="app-main" id="main-content">
    <!-- 由 JS 渲染 -->
  </main>

  <!-- 版权 -->
  <footer class="app-footer">
    <span>© 2026 周大航任务系统 · 版权所有 jnetzhou</span>
  </footer>

  <!-- 手机底部 Tab Bar -->
  <nav class="bottom-tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" data-view="home">
        <span class="tab-icon" data-icon="home"></span>
        <span>首页</span>
      </button>
      <button class="tab-btn" data-view="calendar">
        <span class="tab-icon" data-icon="calendar"></span>
        <span>日历</span>
      </button>
      <button class="tab-btn" data-view="tasks">
        <span class="tab-icon" data-icon="tasks"></span>
        <span>任务</span>
      </button>
      <button class="tab-btn" data-view="rewards">
        <span class="tab-icon" data-icon="rewards"></span>
        <span>奖赏</span>
      </button>
    </div>
  </nav>

  <!-- 脚本 -->
  <script src="js/storage.js?v=20261055"></script>
  <script src="js/models.js?v=20261080"></script>
  <script src="js/calendar.js?v=20261051"></script>
  <script src="js/icons.js?v=20261082"></script>
  <script src="js/app.js?v=20261081"></script>
</body>
</html>
